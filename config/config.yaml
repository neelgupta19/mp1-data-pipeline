validation:
  required_columns:
    - record_id
    - name
    - category
    - status
    - rating
  numeric_columns:
    - rating

processing:
  remove_duplicates: true
  missing:
    enabled: true
    axis: "rows"
  outliers:
    enabled: true
    columns:
      - rating
    method: "iqr"
    threshold: 1.5